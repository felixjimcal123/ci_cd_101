name: CI · API xUnit

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore tests/Integration.Api.Tests/Integration.Api.Tests.csproj
      - name: Tests
        run: dotnet test tests/Integration.Api.Tests/Integration.Api.Tests.csproj --no-restore -c Release
      - name: Publish application
        run: dotnet publish src/Integration.Api/Integration.Api.csproj -c Release -o ./out --no-restore
      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: integration-api-${{ github.sha }}
          path: out/
          if-no-files-found: error
