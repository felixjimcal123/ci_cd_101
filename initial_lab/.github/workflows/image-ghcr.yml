name: Image · GHCR

# Lección 9: solo publicamos desde main. No usamos credenciales de Azure.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish-image:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Normalize GHCR image name
        id: names
        shell: bash
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push with immutable commit tag
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.names.outputs.image }}:${{ github.sha }}
      - name: Emit immutable image reference
        shell: bash
        env:
          IMAGE: ${{ steps.names.outputs.image }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          echo "Image: $IMAGE@$DIGEST" >> "$GITHUB_STEP_SUMMARY"
          echo "Use the digest, not latest, in the deploy workflow." >> "$GITHUB_STEP_SUMMARY"
