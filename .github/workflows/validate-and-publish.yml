# RINDUS ROAD | M01 S3 | CI: validar, construir y publicar.
# PR -> tests + build sin publicar. Push main -> publicar digest y llamar a CD.
name: Application CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'initial_lab/**'
      - '.github/workflows/validate-and-publish.yml'
      - '.github/workflows/deploy.yml'
      - '.github/workflows/deploy-container-app-reusable.yml'

# Permiso por defecto mínimo. Cada job declara solo lo que necesita.
permissions:
  contents: read

concurrency:
  group: application-ci-cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-and-publish:
    name: Validate and Publish Artifact
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # El digest se transmite al job de despliegue.
    outputs:
      digest: ${{ steps.build.outputs.digest }}

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Test
        run: dotnet test initial_lab/tests/Integration.Api.Tests/Integration.Api.Tests.csproj -c Release

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      # En una PR no se publica ninguna imagen.
      - name: Login to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and optionally push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ./initial_lab
          file: ./initial_lab/Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: ghcr.io/${{ github.repository }}:${{ github.sha }}

      - name: Record published digest
        if: github.event_name == 'push'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          echo "Published digest: $DIGEST"
          echo "Digest: $DIGEST" >> "$GITHUB_STEP_SUMMARY"

  # El caller no despliega: entrega el digest que ACABA de producir la CI.
  deploy-approved-artifact:
    name: Deploy Approved Artifact
    needs: validate-and-publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write  # Necesario para Azure OIDC dentro del reusable.
    uses: ./.github/workflows/deploy-container-app-reusable.yml
    with:
      image_digest: ${{ needs.validate-and-publish.outputs.digest }}
