# =============================================================================
# RINDUS ROAD | Misión 01 | Terraform: plan y apply manual con OIDC
# =============================================================================
# OBJETIVO
#   Validar infraestructura de aplicación mediante terraform plan,
#   autenticándose con GitHub OIDC + Microsoft Entra ID (sin Shared Keys).
#
# ALCANCE DE ESTA PRÁCTICA
#   plan: init + validate + plan (sin cambios en Azure).
#   apply: plan + apply del mismo archivo + smoke test HTTP.
#   No crea el Resource Group, Storage Account ni contenedor: bootstrap.yml
#   ya ha verificado que existen y que la identidad tiene acceso a los blobs.
#   init puede descargar proveedores y preparar metadatos del backend.
#
# PRECONDICIONES
#   - Ejecutar desde main: la credencial federada existente está ligada a main.
#   - Variables de repositorio: AZURE_CLIENT_ID, AZURE_TENANT_ID,
#     AZURE_SUBSCRIPTION_ID.
#   - Rol Storage Blob Data Contributor sobre el contenedor tfstate.
#   - Terraform declarado en initial_lab/infra/versions.tf:
#       backend "azurerm" {}
# =============================================================================

name: Terraform Plan / Apply (OIDC)

# Manual y explícito: no planificamos ni desplegamos en cada push.
on:
  workflow_dispatch:
    inputs:
      operation:
        description: "plan = solo revisión; apply = despliegue con aprobación del entorno"
        type: choice
        required: true
        default: plan
        options:
          - plan
          - apply

# contents: read permite checkout; id-token: write permite emitir OIDC.
# Son permisos de GitHub, NO sustituyen a Azure RBAC.
permissions:
  contents: read
  id-token: write

# Variables ARM_* reconocidas por el backend azurerm de Terraform.
# ARM_USE_AZUREAD y ARM_USE_OIDC fuerzan la ruta Entra ID + OIDC.
# Los identificadores no son secretos; no hay contraseña ni client secret.
env:
  ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  ARM_USE_AZUREAD: 'true'
  ARM_USE_OIDC: 'true'

  # Terraform recibe variables TF_VAR_* automáticamente.
  TF_VAR_resource_group_name: rg-rindus-app-dev
  TF_VAR_container_image: ${{ vars.TF_CONTAINER_IMAGE }}
  TF_IN_AUTOMATION: 'true'

  # Backend remoto creado y comprobado por Azure Bootstrap.
  TF_BACKEND_RG: rg-rindus-tfstate
  TF_BACKEND_ACCOUNT: strindustfedbb8fbb
  TF_BACKEND_CONTAINER: tfstate
  TF_BACKEND_KEY: dev.tfstate

# Evita inicializaciones simultáneas de este workflow.
# No reemplaza al bloqueo de estado que Terraform utiliza al operar.
concurrency:
  group: terraform-backend-dev
  cancel-in-progress: false

jobs:
  init:
    name: Terraform ${{ inputs.operation }} (OIDC)
    # Para apply, GitHub exige aprobación SI se configuran reviewers en este entorno.
    # La protección NO se activa por el simple hecho de declarar environment.
    environment: ${{ inputs.operation == 'apply' && 'rindus-dev-deploy' || 'rindus-dev-plan' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Todos los comandos Terraform se ejecutan desde el módulo raíz real.
    defaults:
      run:
        shell: bash
        working-directory: initial_lab/infra

    steps:
      # 1. Descargar el repositorio, incluido el backend "azurerm" {}.
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Obtener credenciales Azure efímeras por federación OIDC.
      #    El mismo Service Principal ya superó las pruebas de bootstrap.
      - name: Login to Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # 3. Instalar Terraform compatible con required_version del proyecto.
      #    No ejecutar init desde una versión anterior a 1.10.
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.10.5'
          terraform_wrapper: false

      # 4. Comprobar la versión utilizada (evidencia en logs).
      - name: Show Terraform version
        run: terraform version

      # 5. Configurar el backend remoto sin modificar versions.tf.
      #    -input=false: no solicitar interacción en un runner desatendido.
      #    -reconfigure: utilizar estos parámetros, sin intentar migrar estado.
      #    NO usar -migrate-state ni -force-copy en esta práctica.
      - name: Initialize AzureRM backend using Entra ID and OIDC
        run: |
          set -euo pipefail
          terraform init -input=false -reconfigure -backend-config="resource_group_name=$TF_BACKEND_RG" -backend-config="storage_account_name=$TF_BACKEND_ACCOUNT" -backend-config="container_name=$TF_BACKEND_CONTAINER" -backend-config="key=$TF_BACKEND_KEY"
          echo "Terraform backend initialization completed."

      # 6. Validar que Terraform dejó configurado el backend esperado.
      #    NO imprimimos ni subimos archivos de estado o credenciales.
      - name: Verify backend metadata
        run: |
          set -euo pipefail
          test -f .terraform/terraform.tfstate
          jq -e --arg key "$TF_BACKEND_KEY" '.backend.type == "azurerm" and .backend.config.key == $key' .terraform/terraform.tfstate > /dev/null
          echo "Backend metadata verified: azurerm / $TF_BACKEND_KEY"
          echo "NOTE: init does not prove that application infrastructure can be deployed."

      # 7. Verificar inputs y sintaxis antes de consultar Azure.
      #    La imagen debe ser la referencia GHCR real, no una inventada.
      - name: Validate Terraform inputs and configuration
        run: |
          set -euo pipefail
          if [[ -z "$TF_VAR_container_image" || "$TF_VAR_container_image" != ghcr.io/* ]]; then
            echo "::error::Configura la variable de repositorio TF_CONTAINER_IMAGE con la imagen GHCR real (preferiblemente por digest)."
            exit 1
          fi
          terraform validate -no-color

      # 8. Plan para ambas operaciones: revisión previa y archivo binario para apply.
      #    -lock-timeout evita fallos por bloqueos transitorios.
      #    -out conserva el plan solo en este runner; NO se sube como artifact.
      - name: Plan application infrastructure
        run: |
          set -euo pipefail
          terraform plan -input=false -no-color -lock-timeout=2m -out=tfplan
          terraform show -no-color tfplan
          echo "Terraform plan completed. Operation requested: ${{ inputs.operation }}"

      # 9. Solo en apply: ejecutar EXACTAMENTE el plan generado en este job.
      #    El entorno rindus-dev-deploy debe tener Required reviewers configurados
      #    en Settings > Environments; sin esa configuración NO hay aprobación.
      #    No subimos tfplan como artifact: puede contener datos sensibles.
      - name: Apply reviewed plan (manual and protected)
        if: inputs.operation == 'apply'
        run: |
          set -euo pipefail
          terraform apply -input=false -no-color -lock-timeout=2m tfplan
          echo "Terraform apply completed."

      # 10. Smoke test mínimo: comprobar respuesta HTTP 2xx/3xx desde la URL
      #     pública generada por Terraform. La ruta / podría no existir en la API;
      #     si devuelve 404, habrá que usar un endpoint real (p.ej. /health).
      #     Esto NO sustituye pruebas funcionales ni verifica el contrato de API.
      - name: Smoke test public API URL
        if: inputs.operation == 'apply'
        run: |
          set -euo pipefail
          API_URL="$(terraform output -raw api_url)"
          echo "Testing $API_URL"
          for attempt in {1..12}; do
            if curl --fail --silent --show-error --location --max-time 15 --output /dev/null "$API_URL"; then
              echo "Smoke test passed: HTTP 2xx/3xx"
              exit 0
            fi
            echo "Attempt $attempt/12 failed; waiting 10s..."
            sleep 10
          done
          echo "::error::Smoke test failed. Check container logs, startup and actual API route."
          exit 1
